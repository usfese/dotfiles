# ======================
# 🚀 基础体验优化
# ======================

profile=gpu-hq
hwdec=auto-safe

vo=gpu-next
gpu-api=vulkan

keep-open=yes
save-position-on-quit=yes

# ======================
# 🎞️ 画质增强
# ======================

scale=ewa_lanczossharp
cscale=ewa_lanczossharp

deband=yes
deband-iterations=4
deband-threshold=32
deband-range=16
deband-grain=4

# 轻微锐化（很关键）
sharpen=0.2

# ======================
# 🖥️ HDR / 色彩（Wayland友好）
# ======================

target-prim=bt.709
target-trc=bt.1886
tone-mapping=bt.2390

# ======================
# 🔊 音频
# ======================

audio-channels=auto-safe

# ======================
# 📺 字幕优化
# ======================

sub-font="Noto Sans CJK JP"
sub-font-size=42
sub-border-size=2
sub-shadow-offset=1
sub-shadow-color="#000000AA"
sub-color="#FFFFFF"

sub-auto=fuzzy

# ======================
# 🎮 流畅性
# ======================

video-sync=display-resample
interpolation=yes

# 隐藏默认UI
osc=no

# ===== 电影级画质 =====

deband=yes
deband-iterations=4
deband-threshold=32

sigmoid-upscaling=yes

audio-normalize-downmix=yes

af=dynaudnorm

# =====================
# 🎧 Audio Enhancement
# =====================

af=highpass=f=200,lowpass=f=15000

audio-normalize-downmix=yes

audio-resample-filter-size=32

# =====================
# 🧠 BASE（所有模式通用）
# =====================

[base]
deband=yes
deband-iterations=4
deband-threshold=32
deband-range=16
deband-grain=6

sharpen=0.15

scale=ewa_lanczossharp
cscale=ewa_lanczossharp

sub-border-size=2
sub-shadow-offset=1

interpolation=yes



# ======================
# 🎬 Anime Normal
# ======================
[anime-normal]
profile=base
glsl-shaders=~~/shaders/Anime4K_Clamp_Highlights.glsl:~~/shaders/Anime4K_Restore_CNN_M.glsl:~~/shaders/Anime4K_Upscale_CNN_x2_L.glsl

# ======================
# 🔥 Anime Upscale（老番）
# ======================
[anime-upscale]
profile=base
glsl-shaders=~~/shaders/Anime4K_AutoDownscalePre_x2.glsl:~~/shaders/Anime4K_Restore_CNN_L.glsl:~~/shaders/Anime4K_Deblur_DoG.glsl:~~/shaders/Anime4K_Upscale_CNN_x2_L.glsl# ======================


# 🎥 Cinema Mode
# ======================
[cinema]
glsl-shaders=no
vo=gpu-next
gpu-api=vulkan
hwdec=nvdec
tone-mapping=bt.2390

glsl-shaders=no
vo=gpu-next
gpu-api=vulkan
hwdec=nvdec
tone-mapping=bt.2390
deband=yes

# ======================
# 🌱 Pure Mode（纯净模式 - 取消所有后处理）
# ======================
[pure]
profile=no
glsl-shaders=no
deband=no
sharpen=0
sigmoid-upscaling=no
interpolation=no
video-sync=display-resample
dscale=mitchell
scale=bilinear
cscale=bilinear
deblock=no
hdr-compute-peak=no
target-prim=
target-trc=
tone-mapping=no
